<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3fb950;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0883e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:0.05" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="16"/>

  <!-- Glow circle -->
  <circle cx="680" cy="40" r="120" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
  </g>

  <!-- Title -->
  <text x="40" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-1">Must-Have Projects</text>

  <!-- Tagline -->
  <text x="40" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#8b949e" font-weight="400">Every open-source project worth knowing — curated daily from YouTube</text>

  <!-- Accent line -->
  <rect x="40" y="120" width="120" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Stats badges -->
  <g transform="translate(40, 148)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="16" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#58a6ff" font-weight="600">⭐ Live Stars</text>
  </g>
  <g transform="translate(182, 148)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="14" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#3fb950" font-weight="600">🔄 Daily Updates</text>
  </g>
  <g transform="translate(324, 148)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="16" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#f0883e" font-weight="600">📡 3 Channels</text>
  </g>

