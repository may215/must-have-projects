  <g transform="translate(720, 30)" fill="#8b949e">
    <path d="M40 0C17.9 0 0 17.9 0 40c0 17.7 11.5 32.7 27.4 38-.2-3.3 0-7.2 1-10.3 1.1-4.5 7-28.7 7-28.7s-1.8-3.6-1.8-8.9c0-8.4 4.9-14.7 11-14.7 5.2 0 7.7 3.9 7.7 8.5 0 5.2-3.3 13-5 20.2-1.4 6.1 3 11 9.1 11 10.9 0 19.3-11.5 19.3-28.1 0-14.7-10.6-25-25.7-25C25.6 5 17 14.2 17 27.7c0 5.5 2.1 11.3 4.8 14.5.6.7.7 1.3.5 2.4-.5 2.1-1.6 6.7-1.8 7.6-.3 1.2-1 1.5-2.3.9-8.6-4-14-16.5-14-26.5C4 18.7 12.6 5 30.5 5 44.6 5 56 14.9 56 29.9c0 11.9-7.5 21.5-17.9 24.9-1.4.5-2.7.8-3.7.8-2.8 0-4.1-1.9-4.1-4.2 0-2.9.5-6.1.9-8 .5-2.2 1.9-9.5 1.9-9.5s-2-3.9-2-9.3c0-8.8 5-10.7 7.8-10.7 2.3 0 4.5 1.7 4.5 4.4 0 3.2-2.1 7.9-3.1 12.3-.9 3.7 1.9 6.6 5.5 6.6 6.6 0 11.7-6.9 11.7-16.9 0-8.8-6.3-15-15.3-15C21.4 9.3 13 18 13 28.7c0 5.6 2.2 10.5 5.1 13.8.6.7.7 1.6.5 2.6-.6 2.3-1.8 7.1-2 7.3-.3.9-1.1 1.2-2.1.8-11.4-4.8-18.6-15.2-18.6-26.6C-4 16.2 8.5 0 25.1 0H40z" transform="scale(0.5)"/>
